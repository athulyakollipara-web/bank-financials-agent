[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-financials-agent"
version = "1.0.0"
description = "Plain-English analytics over bank call report data: governed KPIs, hybrid RAG, validated NL2SQL and LangGraph agents on Amazon Bedrock."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Athulya Kollipara" }]
dependencies = [
    "langgraph>=0.4",
    "boto3>=1.35",
    "sqlglot>=25",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2.0",
]

[project.optional-dependencies]
local = ["pyspark>=3.5", "pandas>=2.0,<3", "great_expectations>=1.0"]
aws = ["opensearch-py>=2.4", "requests>=2.31"]
eval = ["mlflow>=2.14"]
infra = ["aws-cdk-lib>=2.150", "constructs>=10"]
dev = ["pytest>=8", "httpx>=0.27", "moto>=5"]

[project.scripts]
bank-agent = "bank_agent.cli:main"
bank-agent-mcp = "bank_agent.mcp_server:main"

[tool.setuptools.packages.find]
include = ["bank_agent*"]

[tool.setuptools.package-data]
bank_agent = ["semantic/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = ["slow: synthesizes the CDK app (needs Node.js)"]
